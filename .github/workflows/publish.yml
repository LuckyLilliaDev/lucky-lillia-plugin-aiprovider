name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Validate release metadata
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          assert.equal(process.env.GITHUB_REPOSITORY, 'LuckyLilliaDev/lucky-lillia-plugin-aiprovider')
          assert.equal(pkg.name, '@luckylillia/plugin-aiprovider')
          assert.equal(pkg.repository?.type, 'git')
          assert.equal(pkg.repository?.url, 'git+https://github.com/LuckyLilliaDev/lucky-lillia-plugin-aiprovider.git')
          assert.equal(pkg.publishConfig?.registry, 'https://registry.npmjs.org')
          assert.equal(pkg.publishConfig?.access, 'public')
          assert.equal(lock.name, pkg.name)
          assert.equal(lock.version, pkg.version)
          assert.equal(lock.packages[''].name, pkg.name)
          assert.equal(lock.packages[''].version, pkg.version)
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            assert.equal(process.env.GITHUB_REF, 'refs/heads/main', 'Manual publishing is only allowed from main')
          } else {
            assert.equal(process.env.GITHUB_REF, 'refs/tags/v' + pkg.version, 'Tag must match package.json version')
          }
          console.log('Validated ' + pkg.name + '@' + pkg.version)
          NODE

      - name: Install npm with OIDC support
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack the tested build
        id: pack
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/aiprovider-pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { appendFileSync, readFileSync } from 'node:fs'
          import path from 'node:path'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const [pack] = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'aiprovider-pack.json'), 'utf8'))
          assert.equal(pack.name, pkg.name)
          assert.equal(pack.version, pkg.version)
          assert.equal(pack.filename, 'luckylillia-plugin-aiprovider-' + pkg.version + '.tgz')
          for (const file of ['lib/index.js', 'lib/types.d.ts', 'webui/index.js', 'README.md']) {
            assert.ok(pack.files.some(entry => entry.path === file), 'Missing package file: ' + file)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'tarball=' + path.join(process.env.RUNNER_TEMP, pack.filename) + '\n')
          console.log('Packed ' + pack.filename + ': ' + pack.integrity)
          NODE

      - name: Reject an already published version
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const response = await fetch('https://registry.npmjs.org/' + encodeURIComponent(pkg.name) + '/' + encodeURIComponent(pkg.version), {
            signal: AbortSignal.timeout(30_000),
          })
          if (response.ok) throw new Error(pkg.name + '@' + pkg.version + ' is already published; increment the version before releasing')
          if (response.status !== 404) throw new Error('npm registry check failed: HTTP ' + response.status)
          console.log(pkg.name + '@' + pkg.version + ' has not been published')
          NODE

      - name: Publish with npm trusted publishing
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          PACKAGE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$PACKAGE_TARBALL" --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org
